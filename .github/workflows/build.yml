name: Compilar APK Carmelitas

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Pre-aceptar licencias de Android SDK para Flet
        run: |
          mkdir -p "$HOME/Android/Sdk/licenses"
          printf "\n24333f8a63b6825ea9c5514f83c2829b004d1fee" > "$HOME/Android/Sdk/licenses/android-sdk-license"
          printf "\n84831b9409646a918e30573bab4c9c91346d8abd" > "$HOME/Android/Sdk/licenses/android-sdk-preview-license"
          printf "\nd975f751698a77b662f1254ddbeed3901e976f5a" > "$HOME/Android/Sdk/licenses/intel-android-extra-license"

      - name: Instalar Flet y compilar APK
        run: |
          pip install "flet[all]"
          flet build apk --yes --skip-flutter-doctor || flet build apk --yes

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: app-carmelitas-apk
          path: build/apk/*.apk
