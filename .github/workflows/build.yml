name: Compilar APK Carmelitas

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Flet y compilar APK
        run: |
          pip install "flet[all]"
          yes | flet build apk --yes || true
          find "$HOME" -name "sdkmanager" 2>/dev/null | while read sdkm; do
            yes | "$sdkm" --licenses || true
          done
          flet build apk --yes

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: app-carmelitas-apk
          path: build/apk/*.apk
