name: Compilar APK Carmelitas

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Flet y compilar APK
        run: |
          pip install --upgrade pip
          pip install "flet[all]"

          # Primer intento para que Flet descargue Flutter, JDK y Android SDK
          flet build apk --yes || true

          # Aceptar licencias usando el Flutter instalado por Flet
          FLUTTER_BIN=$(find "$HOME" -path "*/flutter/*/bin/flutter" 2>/dev/null | head -n 1)
          if [ -n "$FLUTTER_BIN" ]; then
            yes | "$FLUTTER_BIN" doctor --android-licenses || true
          fi

          # Compilacion definitiva del APK
          flet build apk --yes

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: app-carmelitas-apk
          path: build/apk/*.apk
