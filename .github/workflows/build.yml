name: Compilar APK Carmelitas

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Instalar Flet en el entorno
        run: |
          python3 -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install "flet[all]"

      - name: Compilar APK con Flet
        id: build
        uses: flet-dev/flet-build-action@v1
        with:
          target: apk
          runner-python-version: "3.11"
          bundled-python-version: "3.11"

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: app-carmelitas-apk
          path: ${{ steps.build.outputs.archive-path }}
          archive: false
          if-no-files-found: error
