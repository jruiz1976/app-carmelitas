name: Compilar APK Carmelitas

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Instalar Flet y preparar entorno
        run: |
          pip install --upgrade pip
          pip install "flet==1.1.2"
          flet build apk --yes || true

      - name: Aceptar licencias Android SDK de Flet
        run: |
          yes | /home/runner/flutter/3.47.9/bin/flutter doctor --android-licenses || true

      - name: Compilar APK definitivo
        run: |
          flet build apk --yes --verbose

      - name: Subir APK listo para descargar
        uses: actions/upload-artifact@v4
        with:
          name: app-carmelitas-apk
          path: build/apk/*.apk
